<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f7f5f0" />
  <title>Artikel — слова курса A1</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-soft: #f7f5f0;
      --card-bg: #ffffff;
      --der-color: #3b82f6;
      --der-bg: #eff6ff;
      --der-ring: rgba(59, 130, 246, 0.25);
      --die-color: #ec4899;
      --die-bg: #fdf2f8;
      --die-ring: rgba(236, 72, 153, 0.25);
      --das-color: #10b981;
      --das-bg: #ecfdf5;
      --das-ring: rgba(16, 185, 129, 0.25);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    input, textarea {
      user-select: text;
      -webkit-user-select: text;
      font-size: 16px !important; /* Prevents auto-zoom on iPhone 14 iOS Safari */
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-soft);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #292524;
      -webkit-font-smoothing: antialiased;
    }

    /* Mobile container optimized for iPhone 14 (390x844) & Huawei Pura 70 (412x915) */
    .app-shell {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding-top: max(10px, env(safe-area-inset-top));
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      padding-left: 14px;
      padding-right: 14px;
      position: relative;
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .scroll-area::-webkit-scrollbar {
      display: none;
    }

    /* Gender frames for Study Mode */
    .frame-der {
      border: 5px solid var(--der-color);
      background: linear-gradient(145deg, #ffffff 0%, var(--der-bg) 100%);
      box-shadow: 0 12px 28px -6px var(--der-ring), inset 0 0 0 1px rgba(59,130,246,0.12);
    }
    .frame-die {
      border: 5px solid var(--die-color);
      background: linear-gradient(145deg, #ffffff 0%, var(--die-bg) 100%);
      box-shadow: 0 12px 28px -6px var(--die-ring), inset 0 0 0 1px rgba(236,72,153,0.12);
    }
    .frame-das {
      border: 5px solid var(--das-color);
      background: linear-gradient(145deg, #ffffff 0%, var(--das-bg) 100%);
      box-shadow: 0 12px 28px -6px var(--das-ring), inset 0 0 0 1px rgba(16,185,129,0.12);
    }
    .frame-neutral {
      border: 2px solid #e7e5e4;
      background: linear-gradient(145deg, #ffffff 0%, #fafaf9 100%);
      box-shadow: 0 10px 24px -8px rgba(0, 0, 0, 0.05);
    }

    /* Smooth animations */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(6px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-card {
      animation: fadeSlideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
    }
    .shake {
      animation: shakeError 0.32s ease-in-out;
    }

    @keyframes pulseAudio {
      0% { transform: scale(1); }
      40% { transform: scale(1.035); }
      100% { transform: scale(1); }
    }
    .speaking-pulse {
      animation: pulseAudio 0.45s ease-in-out;
    }

    .soft-btn {
      transition: transform 0.12s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .soft-btn:active {
      transform: scale(0.96);
    }

    /* Пропущенные буквы в режиме запоминания */
    .gap-letter {
      display: inline-block;
      min-width: 0.62em;
      margin: 0 0.03em;
      border-bottom: 2px solid #a8a29e;
      color: #78716c;
      text-align: center;
      line-height: 1.15;
    }
    .gap-letter-open {
      border-bottom-color: #10b981;
      color: #059669;
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell"></div>
  <audio id="ttsAudio" referrerpolicy="no-referrer" preload="none" class="hidden"></audio>

  <script type="module">
    import { session } from "../js/auth.js";
    import { loadProgress, progress, scheduleSave, markDone, onSaveState, pullRemote, siteURL } from "../js/store.js";
    import { esc } from "../js/md.js";
    import { speakGerman } from "../js/speech.js";

    /*************************************************************************
     * 1. СЛОВА: КОЛОДЫ КУРСА (w1d1…w4d6) И ДОПОЛНИТЕЛЬНЫЕ (x01…x50) ИЗ data/words.json
     * Слово: { de, ru, emoji, article: "der"|"die"|"das"|null, plural, pos }
     *************************************************************************/
    let COURSE = [];
    let EXTRA = [];
    let DECKS = [];
    const DECK_BY_ID = new Map();

    async function loadDecks() {
      const res = await fetch(new URL("../data/words.json", import.meta.url), { cache: "no-store" });
      if (!res.ok) throw new Error(`words.json: ${res.status}`);
      const data = await res.json();
      COURSE = data.decks;
      EXTRA = data.extra;
      DECKS = [...COURSE, ...EXTRA];
      DECKS.forEach(d => DECK_BY_ID.set(d.id, d));
    }

    // Шаги дорожки из data/plan.json: засчитываем только шаг type "words" этой колоды
    const PLAN_STEPS = new Map();

    async function loadPlanSteps() {
      try {
        const res = await fetch(siteURL("data/plan.json"), { cache: "no-store" });
        if (!res.ok) throw new Error(`plan.json: ${res.status}`);
        const plan = await res.json();
        plan.weeks.forEach(w => w.days.forEach(d => d.steps.forEach(s => PLAN_STEPS.set(s.id, s))));
      } catch (err) {
        console.warn("plan load failed: steps are not marked", err); // тренажёр работает и без дорожки
      }
    }

    function isWordsStep(stepId, deckId) {
      const step = PLAN_STEPS.get(stepId);
      return !!step && step.type === "words" && step.deck === deckId;
    }

    const fullWord = (w) => (w.article ? `${w.article} ${w.de}` : w.de);

    // Режимы про артикль берут только существительные; режимы обычных слов — слова без артикля;
    // письменная проверка всей колоды — все слова.
    function modePool(deck, mode) {
      const all = deck.words.map((_, i) => i);
      if (mode === "test") return all;
      if (mode === "word_study" || mode === "word_test") return all.filter(i => !deck.words[i].article);
      return all.filter(i => deck.words[i].article);
    }

    const WORD_MODES = new Set(["word_study", "word_test"]);

    // Несколько букв слова прячем: первая остаётся подсказкой, дальше — равномерно по слову.
    function blankPositions(de) {
      const letters = [];
      for (let i = 0; i < de.length; i++) if (/[A-Za-zÄÖÜäöüß]/.test(de[i])) letters.push(i);
      if (!letters.length) return [];
      const anchor = letters.length > 1 ? letters.slice(1) : letters;
      const count = Math.max(1, Math.min(5, Math.round(letters.length / 3)));
      const positions = new Set();
      for (let k = 0; k < count; k++) {
        positions.add(anchor[Math.min(anchor.length - 1, Math.floor(((k + 0.5) * anchor.length) / count))]);
      }
      return Array.from(positions).sort((a, b) => a - b);
    }

    function missingLetters(wordObj) {
      return blankPositions(wordObj.de).map(i => wordObj.de[i]).join('');
    }

    function blankedWordHtml(wordObj, reveal = false) {
      const gaps = new Set(blankPositions(wordObj.de));
      return Array.from(wordObj.de).map((ch, i) => {
        if (!gaps.has(i)) return esc(ch);
        return `<span class="gap-letter${reveal ? ' gap-letter-open' : ''}">${reveal ? esc(ch) : '·'}</span>`;
      }).join('');
    }

    /*************************************************************************
     * 2. ПРОГРЕСС: progress.words[deckId] ИЗ ../js/store.js (localStorage + сервер + gist)
     *************************************************************************/
    const PASS_PERCENT = 80;
    const sess = session();

    function normalizeDeckRecord(rec, deck) {
      const total = deck.words.length;
      const r = rec && typeof rec === "object" ? rec : {};
      const inRange = (n) => Number.isInteger(n) && n >= 0 && n < total;
      const learnedIds = Array.from(new Set(Array.isArray(r.learnedIds) ? r.learnedIds : [])).filter(inRange);
      const run = r.testRun && typeof r.testRun === "object" ? r.testRun : {};
      const wordRun = r.wordTestRun && typeof r.wordTestRun === "object" ? r.wordTestRun : {};
      return {
        learnedIds,
        correct: learnedIds.length,
        percent: total ? Math.min(100, Math.round((learnedIds.length / total) * 100)) : 0,
        studyIndex: Number.isInteger(r.studyIndex) && r.studyIndex >= 0 ? r.studyIndex : 0,
        articleQuizIndex: Number.isInteger(r.articleQuizIndex) && r.articleQuizIndex >= 0 ? r.articleQuizIndex : 0,
        testIndex: Number.isInteger(r.testIndex) && r.testIndex >= 0 ? r.testIndex : 0,
        wordStudyIndex: Number.isInteger(r.wordStudyIndex) && r.wordStudyIndex >= 0 ? r.wordStudyIndex : 0,
        wordTestIndex: Number.isInteger(r.wordTestIndex) && r.wordTestIndex >= 0 ? r.wordTestIndex : 0,
        // Текущий проход письменной проверки: какие слова отвечены и какие верно
        testRun: {
          seen: (Array.isArray(run.seen) ? run.seen : []).filter(inRange),
          ok: (Array.isArray(run.ok) ? run.ok : []).filter(inRange)
        },
        wordTestRun: {
          seen: (Array.isArray(wordRun.seen) ? wordRun.seen : []).filter(inRange),
          ok: (Array.isArray(wordRun.ok) ? wordRun.ok : []).filter(inRange)
        },
        testBest: Number.isInteger(r.testBest) ? r.testBest : 0,
        wordTestBest: Number.isInteger(r.wordTestBest) ? r.wordTestBest : 0,
        updatedAt: r.updatedAt || 0
      };
    }

    function getDeckState(deckId) {
      if (!progress.words) progress.words = {};
      const rec = normalizeDeckRecord(progress.words[deckId], DECK_BY_ID.get(deckId));
      progress.words[deckId] = rec;
      return rec;
    }

    function deckRecord(deckId) {
      return normalizeDeckRecord((progress.words || {})[deckId], DECK_BY_ID.get(deckId));
    }

    // Сохранение ответа по карточке; store.js сразу пишет localStorage, затем сервер и gist
    function recordCardProgress(deckId, wordIdx, isCorrect, nextPos, mode) {
      const deckRec = getDeckState(deckId);
      const learnedSet = new Set(deckRec.learnedIds);
      if (isCorrect) learnedSet.add(wordIdx);
      deckRec.learnedIds = Array.from(learnedSet);
      deckRec.correct = deckRec.learnedIds.length;
      deckRec.percent = Math.min(100, Math.round((deckRec.correct / DECK_BY_ID.get(deckId).words.length) * 100));

      if (typeof nextPos === "number") {
        const safeNext = nextPos >= modePool(DECK_BY_ID.get(deckId), mode).length ? 0 : nextPos;
        if (mode === "study") deckRec.studyIndex = safeNext;
        else if (mode === "article_quiz") deckRec.articleQuizIndex = safeNext;
        else if (mode === "test") deckRec.testIndex = safeNext;
        else if (mode === "word_study") deckRec.wordStudyIndex = safeNext;
        else if (mode === "word_test") deckRec.wordTestIndex = safeNext;
      }
      if (mode === "test") {
        deckRec.testRun.seen = Array.from(new Set([...deckRec.testRun.seen, wordIdx]));
        if (isCorrect) deckRec.testRun.ok = Array.from(new Set([...deckRec.testRun.ok, wordIdx]));
      }
      if (mode === "word_test") {
        deckRec.wordTestRun.seen = Array.from(new Set([...deckRec.wordTestRun.seen, wordIdx]));
        if (isCorrect) deckRec.wordTestRun.ok = Array.from(new Set([...deckRec.wordTestRun.ok, wordIdx]));
      }
      deckRec.updatedAt = Date.now();
      scheduleSave();
    }

    function resetSingleDeckProgress(deckId) {
      progress.words[deckId] = normalizeDeckRecord(null, DECK_BY_ID.get(deckId));
      scheduleSave();
    }

    /** Итог прохода письменной проверки: процент, если отвечены все слова колоды. */
    function finishTestRun(deckId) {
      const deck = DECK_BY_ID.get(deckId);
      const rec = getDeckState(deckId);
      if (rec.testRun.seen.length < deck.words.length) return null;
      const pct = Math.round((rec.testRun.ok.length / deck.words.length) * 100);
      rec.testBest = Math.max(rec.testBest, pct);
      rec.testRun = { seen: [], ok: [] };
      rec.testIndex = 0;
      if (pct >= PASS_PERCENT && isWordsStep(state.stepId, deckId)) {
        markDone(state.stepId, { words: deckId, score: pct });
      } else {
        scheduleSave();
      }
      return pct;
    }

    /** Итог прохода проверки обычных слов: процент, если отвечены все слова без артикля. */
    function finishWordTestRun(deckId) {
      const deck = DECK_BY_ID.get(deckId);
      const rec = getDeckState(deckId);
      const total = modePool(deck, "word_test").length;
      if (!total || rec.wordTestRun.seen.length < total) return null;
      const pct = Math.round((rec.wordTestRun.ok.length / total) * 100);
      rec.wordTestBest = Math.max(rec.wordTestBest, pct);
      rec.wordTestRun = { seen: [], ok: [] };
      rec.wordTestIndex = 0;
      scheduleSave();
      return pct;
    }

    // Сбор всех изученных слов по всем колодам
    function collectAllLearnedWords() {
      const list = [];
      DECKS.forEach(deck => {
        deckRecord(deck.id).learnedIds.forEach(wordIdx => {
          const wordObj = deck.words[wordIdx];
          if (wordObj) list.push({ deckId: deck.id, wordIdx, wordObj, deckTitle: deck.title });
        });
      });
      return list;
    }

    let autoAdvanceTimer = null;
    function clearAutoAdvanceTimer() {
      if (autoAdvanceTimer) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
      }
    }

    const state = {
      screen: "loading", // "loading" | "nologin" | "error" | "categories" | "mode_select" | "session" | "summary"
      searchQuery: "",
      selectedDeckId: null,
      mode: "study", // "study" | "article_quiz" | "test" | "word_study" | "word_test" | "learned_quiz"
      pool: [], // Индексы слов колоды в этой сессии
      quizPool: [], // Список всех выученных слов для режима "Проверка изученных слов"
      cardIndex: 0,
      sessionCorrect: 0,
      sessionAnswered: 0,
      mistakes: [],
      feedback: null, // { isCorrect, userAnswer, correctFull }
      testInput: "",
      blankInput: "", // пропущенные буквы в режиме запоминания
      testResult: null, // процент полного прохода проверки
      wordTestResult: null, // процент проверки обычных слов
      stepId: null, // шаг дорожки из ссылки #deck=…&step=…
      saveState: "saved",
      errorMsg: ""
    };

    // Enter после ответа работает как кнопка «Следующее слово»
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" || state.screen !== "session" || !state.feedback) return;
      if (e.target.closest("input, textarea, select, button, a")) return;
      const nextBtn = document.getElementById("nextCardBtn");
      if (!nextBtn) return;
      e.preventDefault();
      nextBtn.click();
    });

    // Телефон и ноутбук делят gist: при возвращении на вкладку берём более новую копию
    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible" && state.screen !== "session" && await pullRemote()) render();
    });

    /*************************************************************************
     * 4. ГЕНЕРАТОР МГНОВЕННЫХ ВЕКТОРНЫХ SVG-КАРТОЧЕК (0 МС ЗАГРУЗКИ)
     *************************************************************************/
    function renderSvgIllustration(wordObj, showGenderColor, article) {
      let palette = { bg1: "#f5f5f4", bg2: "#e7e5e4", accent: "#a8a29e" };
      if (showGenderColor) {
        if (article === "der") palette = { bg1: "#eff6ff", bg2: "#dbeafe", accent: "#3b82f6" };
        if (article === "die") palette = { bg1: "#fdf2f8", bg2: "#fce7f3", accent: "#ec4899" };
        if (article === "das") palette = { bg1: "#ecfdf5", bg2: "#d1fae5", accent: "#10b981" };
      }

      return `
        <svg viewBox="0 0 240 165" class="w-full h-full pointer-events-none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="gradCard" cx="50%" cy="45%" r="60%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
              <stop offset="100%" stop-color="${palette.bg1}" stop-opacity="0.65"/>
            </radialGradient>
          </defs>
          <rect width="240" height="165" rx="22" fill="url(#gradCard)" />
          <circle cx="40" cy="34" r="22" fill="${palette.bg2}" opacity="0.55" />
          <circle cx="200" cy="132" r="30" fill="${palette.bg2}" opacity="0.55" />
          <circle cx="120" cy="83" r="52" fill="#ffffff" opacity="0.88" />
          <circle cx="120" cy="83" r="52" fill="none" stroke="${palette.accent}" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />
          <text x="120" y="101" text-anchor="middle" font-size="60" style="filter: drop-shadow(0 6px 10px rgba(0,0,0,0.08));">${esc(wordObj.emoji)}</text>
        </svg>
      `;
    }

    /*************************************************************************
     * 5. НЕМЕЦКАЯ ОЗВУЧКА СТРОГО С АРТИКЛЕМ (общий модуль ../js/speech.js)
     * Произносит "${article} ${de}", запускается по нажатию и после ответа.
     *************************************************************************/
    function speakGermanWordWithArticle(wordObj, buttonEl = null) {
      if (!wordObj || !wordObj.de) return;
      speakGerman(fullWord(wordObj).trim(), buttonEl || document.getElementById("MainSpeakButton"));
    }

    /*************************************************************************
     * 7. РЕНДЕРИНГ ЭКРАНОВ ПРИЛОЖЕНИЯ (БЕЗ ХЭДЕРА И ФУТЕРА)
     *************************************************************************/
    const appEl = document.getElementById("app");

    function render() {
      if (state.screen === "loading" || state.screen === "nologin" || state.screen === "error") {
        renderEntry();
      } else if (state.screen === "categories") {
        renderCategories();
      } else if (state.screen === "mode_select") {
        renderModeSelect();
      } else if (state.screen === "session") {
        renderSession();
      } else if (state.screen === "summary") {
        renderSummary();
      }
    }

    /* ЭКРАН 1: ЗАГРУЗКА / ВХОД ЧЕРЕЗ САЙТ */
    function renderEntry() {
      const text = state.screen === "loading"
        ? "Загружаю слова и прогресс…"
        : state.screen === "error"
          ? state.errorMsg
          : "Войдите на сайте курса — прогресс тренажёра хранится в вашем аккаунте.";
      appEl.innerHTML = `
        <div class="flex-1 flex flex-col justify-center items-center px-2 animate-card">
          <div class="w-full bg-white rounded-3xl p-6 shadow-sm border border-stone-200/80">
            <div class="flex flex-col items-center text-center mb-6">
              <div class="w-16 h-16 rounded-2xl bg-stone-100 flex items-center justify-center text-3xl mb-3 shadow-inner">
                🇩🇪
              </div>
              <h1 class="text-xl font-bold text-stone-800 tracking-tight">Artikel Trainer</h1>
              <p class="text-xs text-stone-400 mt-1">Слова курса A1 по дням и 50 тем</p>
            </div>

            <p class="text-sm text-stone-600 text-center ${state.screen === "error" ? "text-rose-600" : ""}">${esc(text)}</p>

            ${state.screen === "nologin" ? `
              <a
                id="loginLink"
                href="../#/login"
                class="soft-btn block w-full py-3.5 rounded-2xl bg-stone-800 text-white font-semibold text-sm text-center shadow-sm hover:bg-stone-700 mt-5"
              >
                Войти
              </a>
            ` : ''}

            <div class="mt-5 pt-4 border-t border-stone-100 flex items-center justify-center gap-2 text-[11px] text-stone-400">
              <span class="inline-block w-2 h-2 rounded-full bg-blue-400"></span> der
              <span class="inline-block w-2 h-2 rounded-full bg-pink-400 ml-2"></span> die
              <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 ml-2"></span> das
            </div>
          </div>
        </div>
      `;
    }

    /* ЭКРАН 2: КОЛОДЫ КУРСА ПО НЕДЕЛЯМ + ДОПОЛНИТЕЛЬНЫЕ + БАННЕР ПРОВЕРКИ ПО ВСЕМ ИЗУЧЕННЫМ СЛОВАМ */
    const SAVE_BADGE = {
      saved: ["✓ Сохранено", "bg-emerald-50 text-emerald-700 border-emerald-200/60"],
      local: ["✓ На устройстве", "bg-emerald-50 text-emerald-700 border-emerald-200/60"],
      pending: ["… Сохраняю", "bg-stone-50 text-stone-500 border-stone-200/60"],
      error: ["⚠ Нет связи", "bg-rose-50 text-rose-700 border-rose-200/60"]
    };

    function saveBadgeHtml() {
      const [label, cls] = SAVE_BADGE[state.saveState] || SAVE_BADGE.saved;
      return `<span id="saveBadge" class="inline-flex items-center px-1.5 py-0.5 rounded-md text-[10px] font-semibold border ${cls}">${label}</span>`;
    }

    function renderDeckCard(deck) {
      const prog = deckRecord(deck.id);
      const barColor = prog.percent >= 80 ? 'bg-emerald-500' : prog.percent >= 40 ? 'bg-blue-500' : 'bg-stone-400';
      return `
        <button
          data-deck-id="${esc(deck.id)}"
          class="deck-card soft-btn w-full text-left bg-white rounded-2xl p-3.5 shadow-sm border border-stone-200/70 flex items-center gap-3.5"
        >

    function startDeckSession(mode, startIdx = 0) {
      clearAutoAdvanceTimer();
      const deck = DECK_BY_ID.get(state.selectedDeckId);
      state.mode = mode;
      state.pool = modePool(deck, mode);
      if (!state.pool.length) return;
      state.cardIndex = startIdx >= 0 && startIdx < state.pool.length ? startIdx : 0;
      if (mode === "test" && state.cardIndex === 0) {
        getDeckState(deck.id).testRun = { seen: [], ok: [] }; // новый проход проверки
      }
      if (mode === "word_test" && state.cardIndex === 0) {
        getDeckState(deck.id).wordTestRun = { seen: [], ok: [] }; // новый проход проверки обычных слов
      }
      state.testResult = null;
      state.wordTestResult = null;
      state.sessionCorrect = 0;
      state.sessionAnswered = 0;
      state.mistakes = [];
      state.feedback = null;
      state.testInput = "";
      state.blankInput = "";
      state.screen = "session";
      render();
    }

                    type="button"
                    aria-label="Озвучить слово по-немецки"
                    class="soft-btn w-9 h-9 rounded-full bg-stone-100 hover:bg-stone-200 border border-stone-200/80 text-stone-700 flex items-center justify-center text-base shadow-xs"
                    title="Озвучить слово"
                  >
                    🎙️
                  </button>
                </div>
                <p class="text-sm text-stone-500 mt-0.5">${esc(wordObj.ru)}</p>
              ` : `
                <div class="flex items-center justify-center gap-2">
                  <p class="text-lg font-bold text-stone-800">${esc(wordObj.ru)}</p>
                  <button
                    id="MainSpeakButton"
                    type="button"
                    aria-label="Озвучить слово по-немецки"
                    class="soft-btn w-9 h-9 rounded-full bg-stone-100 hover:bg-stone-200 border border-stone-200/80 text-stone-700 flex items-center justify-center text-base shadow-xs"
                    title="Озвучить слово"
                  >
                    🎙️
                  </button>
                </div>
                <p class="text-xs text-stone-400 mt-0.5">${isWordTest ? 'Напишите немецкое слово целиком' : wordObj.article ? 'Впишите артикль и немецкое слово' : 'Впишите немецкое слово'}</p>
              `}
            </div>
          </div>

          <!-- Нижний блок взаимодействия -->
          <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-stone-200/80">
            ${isArticleSelectionMode ? renderStudyControls(wordObj) : isWordStudy ? renderWordStudyControls(wordObj) : renderTestControls(wordObj)}
          </div>
        </div>
      `;

      document.getElementById("exitSessionBtn").addEventListener("click", () => {
        clearAutoAdvanceTimer();
        state.screen = "categories";
        render();
      });

      document.getElementById("finishNowBtn").addEventListener("click", () => {
        clearAutoAdvanceTimer();
        state.screen = "summary";
        render();
      });

      // Озвучка СТРОГО по нажатию на кнопку микрофона и СТРОГО с артиклем (der/die/das + Wort)
      const speakBtn = document.getElementById("MainSpeakButton");
      if (speakBtn) {
        speakBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          speakGermanWordWithArticle(wordObj, speakBtn);
        });
      }

      if (isArticleSelectionMode) {
        bindStudyEvents(wordObj);
      } else if (isWordStudy) {
        bindWordStudyEvents(wordObj);
      } else {
        bindTestEvents(wordObj);
      }
    }

    function renderStudyControls(wordObj) {
      const hasFeedback = Boolean(state.feedback);
      const chosenArt = hasFeedback ? state.feedback.userAnswer : null;
      const isOk = hasFeedback ? state.feedback.isCorrect : false;

      const getArtBtnClasses = (art, baseClasses, activeCorrectClasses, activeWrongClasses) => {
        if (!hasFeedback) return baseClasses;
        if (art === wordObj.article) return activeCorrectClasses;
        if (art === chosenArt && !isOk) return activeWrongClasses;
        return baseClasses + " opacity-45";
      };

      const derClasses = getArtBtnClasses(
        "der",
        "bg-blue-50 hover:bg-blue-100 border-2 border-blue-300 text-blue-700",
        "bg-blue-600 border-2 border-blue-600 text-white ring-4 ring-blue-200",
        "bg-rose-50 border-2 border-rose-400 text-rose-700 line-through"
      );
      const dieClasses = getArtBtnClasses(
        "die",
        "bg-pink-50 hover:bg-pink-100 border-2 border-pink-300 text-pink-700",
        "bg-pink-500 border-2 border-pink-500 text-white ring-4 ring-pink-200",
        "bg-rose-50 border-2 border-rose-400 text-rose-700 line-through"
      );
      const dasClasses = getArtBtnClasses(
        "das",
        "bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-300 text-emerald-700",
        "bg-emerald-500 border-2 border-emerald-500 text-white ring-4 ring-emerald-200",
        "bg-rose-50 border-2 border-rose-400 text-rose-700 line-through"
      );

      return `
        <div class="space-y-2.5">
          ${!hasFeedback ? `
            <div class="text-center text-xs text-stone-400">Выберите правильный артикль:</div>
          ` : `
            <div class="py-1.5 px-3 rounded-xl text-xs font-semibold text-center ${
              isOk
                ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                : 'bg-rose-50 text-rose-700 border border-rose-200'
            }">
              ${isOk
                ? `✓ Верно! ${esc(fullWord(wordObj))}${wordObj.plural ? ` · ${esc(wordObj.plural)}` : ''}`
                : `Ошибка · правильно: ${esc(fullWord(wordObj))}${wordObj.plural ? ` · ${esc(wordObj.plural)}` : ''}`}
            </div>
          `}

          <div class="grid grid-cols-3 gap-2.5">
            <button
              data-art="der"
              ${hasFeedback ? 'disabled' : ''}
              class="art-btn soft-btn py-3.5 rounded-2xl font-bold text-base shadow-sm transition-all ${derClasses}"
            >
              ${hasFeedback && wordObj.article === 'der' ? '✓ der' : 'der'}
            </button>
            <button
              data-art="die"
              ${hasFeedback ? 'disabled' : ''}
              class="art-btn soft-btn py-3.5 rounded-2xl font-bold text-base shadow-sm transition-all ${dieClasses}"
            >
              ${hasFeedback && wordObj.article === 'die' ? '✓ die' : 'die'}
            </button>
            <button
              data-art="das"
              ${hasFeedback ? 'disabled' : ''}
              class="art-btn soft-btn py-3.5 rounded-2xl font-bold text-base shadow-sm transition-all ${dasClasses}"
            >
              ${hasFeedback && wordObj.article === 'das' ? '✓ das' : 'das'}
            </button>
          </div>

          ${hasFeedback ? `
            <button id="nextCardBtn" class="soft-btn w-full py-3 rounded-2xl bg-stone-800 text-white font-semibold text-sm">
              Дальше →
            </button>
          ` : ''}
        </div>
      `;
    }

    function bindStudyEvents(wordObj) {
      document.querySelectorAll(".art-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          if (state.feedback) return;
          const chosen = btn.getAttribute("data-art");
          const isCorrect = chosen === wordObj.article;
          state.sessionAnswered++;
          if (isCorrect) {
            state.sessionCorrect++;
          } else {
            state.mistakes.push({
              wordObj,
              userAnswer: `${chosen} ${wordObj.de}`
            });
          }

          // Мгновенно сохраняем результат этой карточки в прогресс сайта
          recordCardProgress(
            state.selectedDeckId,
            state.pool[state.cardIndex],
            isCorrect,
            state.cardIndex + 1,
            state.mode
          );

          state.feedback = {
            isCorrect,
            userAnswer: chosen,
            correctFull: fullWord(wordObj)
          };
          render();

          // Автоматическая озвучка слова с артиклем сразу после выбора ответа
          speakGermanWordWithArticle(wordObj);
        });
      });

      const nextBtn = document.getElementById("nextCardBtn");
      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          clearAutoAdvanceTimer();
          state.feedback = null;
          advanceOrSummarize();
        });
      }
    }

    function charButtonsHtml() {
      return `
        <button type="button" data-char="ä" class="char-btn soft-btn px-2.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-semibold">ä</button>
        <button type="button" data-char="ö" class="char-btn soft-btn px-2.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-semibold">ö</button>
        <button type="button" data-char="ü" class="char-btn soft-btn px-2.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-semibold">ü</button>
        <button type="button" data-char="ß" class="char-btn soft-btn px-2.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-semibold">ß</button>
      `;
    }

    function renderWordStudyControls(wordObj) {
      if (state.feedback) {
        const isOk = state.feedback.isCorrect;
        return `
          <div class="text-center space-y-2.5">
            <div class="py-2.5 px-3 rounded-2xl text-sm font-semibold ${isOk ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}">
              ${isOk
                ? `✓ Верно! ${blankedWordHtml(wordObj, true)}`
                : `Пропущено: «${esc(state.feedback.userAnswer || '—')}»<br/>Верно: <b>${blankedWordHtml(wordObj, true)}</b>`}
            </div>
            <button id="nextCardBtn" class="soft-btn w-full py-3.5 rounded-2xl bg-stone-800 text-white font-semibold text-sm">
              Следующее слово →
            </button>
          </div>
        `;
      }

      const gaps = blankPositions(wordObj.de).length;
      return `
        <form id="wordStudyForm" class="space-y-2.5" autocomplete="off">
          <div class="flex items-center justify-center gap-2">
            ${charButtonsHtml()}
          </div>
          <div class="text-center text-xs text-stone-400">
            Пропущено букв: <b class="text-stone-600">${gaps}</b> · впишите только их, по порядку
          </div>
          <div class="flex gap-2">
            <input
              id="wordStudyInput"
              type="text"
              value="${esc(state.blankInput)}"
              placeholder="Пропущенные буквы"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              class="flex-1 px-4 py-3 rounded-2xl bg-stone-50 border border-stone-200 text-stone-800 focus:outline-none focus:border-stone-400 focus:bg-white"
            />
            <button type="submit" class="soft-btn px-5 py-3 rounded-2xl bg-stone-800 text-white font-semibold text-sm shrink-0">
              ОК
            </button>
          </div>
        </form>
      `;
    }

    function normalizeLetters(str) {
      return umlautFree(String(str).toLowerCase().replace(/[^a-zäöüß]/g, ''));
    }

    function bindWordStudyEvents(wordObj) {
      const inputEl = document.getElementById("wordStudyInput");
      if (inputEl) {
        inputEl.addEventListener("input", (e) => {
          state.blankInput = e.target.value;
        });
      }

      document.querySelectorAll(".char-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const ch = btn.getAttribute("data-char");
          if (!inputEl) return;
          const start = inputEl.selectionStart || inputEl.value.length;
          const end = inputEl.selectionEnd || inputEl.value.length;
          inputEl.value = inputEl.value.slice(0, start) + ch + inputEl.value.slice(end);
          state.blankInput = inputEl.value;
          inputEl.focus();
          inputEl.setSelectionRange(start + 1, start + 1);
        });
      });

      const form = document.getElementById("wordStudyForm");
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const userRaw = (inputEl ? inputEl.value : state.blankInput).trim();
          if (!userRaw) return;

          const expected = normalizeLetters(missingLetters(wordObj));
          const actual = normalizeLetters(userRaw);
          const isCorrect = Boolean(actual) && actual === expected;
          state.sessionAnswered++;
          if (isCorrect) {
            state.sessionCorrect++;
          } else {
            state.mistakes.push({ wordObj, userAnswer: userRaw });
          }

          recordCardProgress(
            state.selectedDeckId,
            state.pool[state.cardIndex],
            isCorrect,
            state.cardIndex + 1,
            "word_study"
          );

          state.feedback = {
            isCorrect,
            userAnswer: userRaw,
            correctFull: wordObj.de
          };
          state.blankInput = "";
          render();
          speakGermanWordWithArticle(wordObj);
        });
      }

      const nextBtn = document.getElementById("nextCardBtn");
      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          state.feedback = null;
          state.blankInput = "";
          advanceOrSummarize();
        });
      }
    }

    function renderTestControls(wordObj) {
      if (state.feedback) {
        const isOk = state.feedback.isCorrect;
        return `
          <div class="text-center space-y-2.5">
            <div class="py-2.5 px-3 rounded-2xl text-sm font-semibold ${isOk ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}">
              ${isOk
                ? `Отлично! ${esc(fullWord(wordObj))}${wordObj.plural ? ` · ${esc(wordObj.plural)}` : ''}`
                : `Ваш ответ: «${esc(state.feedback.userAnswer || '—')}»<br/>Верно: <b>${esc(fullWord(wordObj))}</b>${wordObj.plural ? ` · ${esc(wordObj.plural)}` : ''}`}
            </div>
            <button id="nextCardBtn" class="soft-btn w-full py-3.5 rounded-2xl bg-stone-800 text-white font-semibold text-sm">
              Следующее слово →
            </button>
          </div>
        `;
      }

      const isWordCheck = state.mode === "word_test";
      return `
        <form id="testAnswerForm" class="space-y-2.5" autocomplete="off">
          <!-- Быстрые кнопки умлаутов (и артиклей для проверки всей колоды) -->
          <div class="flex items-center ${isWordCheck ? 'justify-center' : 'justify-between'} gap-1">
            ${isWordCheck ? '' : `
              <button type="button" data-prefix="der " class="prefix-btn soft-btn px-2.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-semibold">der</button>
              <button type="button" data-prefix="die " class="prefix-btn soft-btn px-2.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-semibold">die</button>
              <button type="button" data-prefix="das " class="prefix-btn soft-btn px-2.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-semibold">das</button>
              <div class="h-4 w-px bg-stone-200 mx-0.5"></div>
            `}
            ${charButtonsHtml()}
          </div>

          <div class="flex gap-2">
            <input
              id="testWordInput"
              type="text"
              value="${esc(state.testInput)}"
              placeholder="${isWordCheck ? 'Написать слово целиком' : 'Напр.: der Tisch'}"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              class="flex-1 px-4 py-3 rounded-2xl bg-stone-50 border border-stone-200 text-stone-800 focus:outline-none focus:border-stone-400 focus:bg-white"
            />
            <button type="submit" class="soft-btn px-5 py-3 rounded-2xl bg-stone-800 text-white font-semibold text-sm shrink-0">
              ОК
            </button>
          </div>
        </form>
      `;
    }

    function normalizeGermanAnswer(str) {
      return str
        .trim()
        .replace(/[’`]/g, "'")
        .replace(/[.!?]+$/, '')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();
    }

    function umlautFree(str) {
      return str.replace(/ß/g, "ss").replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue");
    }

    function bindTestEvents(wordObj) {
      const inputEl = document.getElementById("testWordInput");
      if (inputEl) {
        inputEl.addEventListener("input", (e) => {
          state.testInput = e.target.value;
        });
      }

      document.querySelectorAll(".prefix-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const pref = btn.getAttribute("data-prefix");
          if (!inputEl) return;
          const clean = inputEl.value.replace(/^(der|die|das)\s+/i, "");
          inputEl.value = pref + clean;
          state.testInput = inputEl.value;
          inputEl.focus();
        });
      });

      document.querySelectorAll(".char-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const ch = btn.getAttribute("data-char");
          if (!inputEl) return;
          const start = inputEl.selectionStart || inputEl.value.length;
          const end = inputEl.selectionEnd || inputEl.value.length;
          inputEl.value = inputEl.value.slice(0, start) + ch + inputEl.value.slice(end);
          state.testInput = inputEl.value;
          inputEl.focus();
          inputEl.setSelectionRange(start + 1, start + 1);
        });
      });

      const form = document.getElementById("testAnswerForm");
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const userRaw = (inputEl ? inputEl.value : state.testInput).trim();
          if (!userRaw) return;

          const expected = normalizeGermanAnswer(fullWord(wordObj));
          const actual = normalizeGermanAnswer(userRaw);

          // ss вместо ß и ae/oe/ue вместо ä/ö/ü тоже верно
          const isCorrect = actual === expected || umlautFree(actual) === umlautFree(expected);
          state.sessionAnswered++;
          if (isCorrect) {
            state.sessionCorrect++;
          } else {
            state.mistakes.push({
              wordObj,
              userAnswer: userRaw
            });
          }

          if (state.mode === "learned_quiz") {
            const item = state.quizPool[state.cardIndex];
            if (item) {
              recordCardProgress(item.deckId, item.wordIdx, isCorrect, null, "learned_quiz");
            }
          } else {
            recordCardProgress(
              state.selectedDeckId,
              state.pool[state.cardIndex],
              isCorrect,
              state.cardIndex + 1,
              state.mode
            );
          }

          state.feedback = {
            isCorrect,
            userAnswer: userRaw,
            correctFull: fullWord(wordObj)
          };
          state.testInput = "";
          render();

          // Автоматическая озвучка слова с артиклем сразу после отправки ответа
          speakGermanWordWithArticle(wordObj);
        });
      }

      const nextBtn = document.getElementById("nextCardBtn");
      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          state.feedback = null;
          state.testInput = "";
          advanceOrSummarize();
        });
      }
    }

    function advanceOrSummarize() {
      const totalLen = state.mode === "learned_quiz"
        ? state.quizPool.length
        : state.pool.length;

      if (state.cardIndex + 1 < totalLen) {
        state.cardIndex++;
        render();
      } else {
        // Колода пройдена до конца: итог проверки ≥ 80 % засчитывает шаг дорожки
        if (state.mode === "test") state.testResult = finishTestRun(state.selectedDeckId);
        if (state.mode === "word_test") state.wordTestResult = finishWordTestRun(state.selectedDeckId);
        state.screen = "summary";
        render();
      }
    }

    /* ЭКРАН 5: ИТОГ ПО КОЛОДЕ ИЛИ ПО ВСЕМ ИЗУЧЕННЫМ СЛОВАМ */
    function renderSummary() {
      clearAutoAdvanceTimer();
      const isLearnedQuiz = state.mode === "learned_quiz";
      let title = "";
      let subtitle = "";
      let statLeftTop = "";
      let statLeftBottom = "";
      let statRightTop = "";
      let statRightBottom = "";
      let badgeEmoji = "🌱";

      if (isLearnedQuiz) {
        const accuracy = state.sessionAnswered > 0
          ? Math.round((state.sessionCorrect / state.sessionAnswered) * 100)
          : 0;
        badgeEmoji = accuracy >= 80 ? "🏆" : accuracy >= 50 ? "👏" : "🎯";
        title = "Проверка изученных слов";
        subtitle = `Профиль: ${esc(sess.user)} · Всего в пуле: ${state.quizPool.length} сл.`;
        statLeftTop = `${state.sessionCorrect} / ${state.sessionAnswered}`;
        statLeftBottom = "Верных ответов в сессии";
        statRightTop = `${accuracy}%`;
        statRightBottom = "Точность проверки";
      } else {
        const deck = DECK_BY_ID.get(state.selectedDeckId);
        const deckProg = getDeckState(deck.id);
        const hasWordResult = state.mode === "word_test" && state.wordTestResult !== null;
        const hasResult = (state.mode === "test" && state.testResult !== null) || hasWordResult;
        const shown = state.mode === "test"
          ? (state.testResult ?? deckProg.percent)
          : state.mode === "word_test"
            ? (state.wordTestResult ?? deckProg.wordTestBest)
            : deckProg.percent;
        badgeEmoji = shown >= 80 ? "🏆" : shown >= 50 ? "👏" : "🌱";
        title = deck.title;
        const modeTitle = state.mode === "study"
          ? "Изучение"
          : state.mode === "article_quiz"
            ? "Тренировка артикля"
            : state.mode === "word_study"
              ? "Запоминание слов"
              : state.mode === "word_test"
                ? "Проверка слов"
                : "Проверка";
        const stepDone = isWordsStep(state.stepId, deck.id) && progress.steps[state.stepId]?.status === "done";
        subtitle = `Режим: ${modeTitle} · Профиль: ${esc(sess.user)}${stepDone ? ' · ✓ шаг дорожки засчитан' : ''}`;
        statLeftTop = `${deckProg.correct} / ${deck.words.length}`;
        statLeftBottom = "Всего изучено в колоде";
        statRightTop = `${shown}%`;
        statRightBottom = hasWordResult
          ? `Итог проверки слов (нужно ${PASS_PERCENT}%)`
          : hasResult
            ? `Итог проверки (нужно ${PASS_PERCENT}%)`
            : state.mode === "word_test" ? "Лучший итог проверки слов" : "Сохранённый прогресс";
      }

      appEl.innerHTML = `
        <div class="flex-1 flex flex-col h-full animate-card">
          <div class="bg-white rounded-3xl p-5 shadow-sm border border-stone-200/80 text-center mb-3">
            <div class="w-16 h-16 rounded-3xl bg-stone-50 border border-stone-100 flex items-center justify-center text-3xl mx-auto mb-2">
              ${badgeEmoji}
            </div>
            <h2 class="text-lg font-bold text-stone-800">${esc(title)}</h2>
            <p class="text-xs text-stone-400 mt-0.5">${subtitle}</p>

            <div class="grid grid-cols-2 gap-2.5 my-4">
              <div class="p-3 rounded-2xl bg-stone-50 border border-stone-100">
                <div class="text-xl font-bold text-stone-800">${statLeftTop}</div>
                <div class="text-[11px] text-stone-400">${statLeftBottom}</div>
              </div>
              <div class="p-3 rounded-2xl bg-stone-50 border border-stone-100">
                <div class="text-xl font-bold text-emerald-600">${statRightTop}</div>
                <div class="text-[11px] text-stone-400">${statRightBottom}</div>
              </div>
            </div>

            <div class="flex gap-2">
              <button id="retryDeckBtn" class="soft-btn flex-1 py-3 rounded-2xl bg-stone-100 text-stone-700 font-semibold text-xs">
                ${isLearnedQuiz ? 'Ещё раз' : 'Пройти сначала'}
              </button>
              <button id="toCategoriesBtn" class="soft-btn flex-1 py-3 rounded-2xl bg-stone-800 text-white font-semibold text-xs">
                К колодам
              </button>
            </div>
          </div>

          <!-- Список ошибок (с кнопкой микрофона для озвучки каждого слова с артиклем) -->
          <div class="scroll-area space-y-2 pb-4">
            ${state.mistakes.length === 0 ? `
              <div class="bg-white rounded-2xl p-5 text-center border border-stone-200/60 text-xs text-stone-400">
                Ни одной ошибки в этой сессии!
              </div>
            ` : `
              <div class="text-xs font-semibold text-stone-500 px-1 mb-1">
                Ошибки в сессии:
              </div>
              ${state.mistakes.map((m, idx) => {
                const badgeColor = m.wordObj.article === 'der'
                  ? 'bg-blue-100 text-blue-700'
                  : m.wordObj.article === 'die'
                    ? 'bg-pink-100 text-pink-700'
                    : 'bg-emerald-100 text-emerald-700';
                return `
                  <div class="w-full bg-white rounded-2xl p-3 border border-stone-200/70 flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2.5 min-w-0">
                      <span class="text-xl shrink-0">${esc(m.wordObj.emoji)}</span>
                      <div class="min-w-0">
                        <div class="text-xs font-bold text-stone-800 truncate">
                          ${m.wordObj.article ? `<span class="px-1.5 py-0.5 rounded-md ${badgeColor}">${esc(m.wordObj.article)}</span>` : ''}
                          ${esc(m.wordObj.de)}
                        </div>
                        <div class="text-[11px] text-stone-400 truncate">${esc(m.wordObj.ru)} · <span class="text-rose-500 line-through">${esc(m.userAnswer)}</span></div>
                      </div>
                    </div>
                    <button
                      type="button"
                      data-mistake-idx="${idx}"
                      aria-label="Озвучить с артиклем"
                      class="mistake-mic-btn soft-btn w-9 h-9 rounded-full bg-stone-100 hover:bg-stone-200 border border-stone-200/80 text-stone-700 flex items-center justify-center text-sm shrink-0"
                    >
                      🎙️
                    </button>
                  </div>
                `;
              }).join('')}
            `}
          </div>
        </div>
      `;

      document.querySelectorAll(".mistake-mic-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.getAttribute("data-mistake-idx"), 10);
          const mistake = state.mistakes[idx];
          if (mistake && mistake.wordObj) {
            speakGermanWordWithArticle(mistake.wordObj, btn);
          }
        });
      });

      document.getElementById("retryDeckBtn").addEventListener("click", () => {
        if (isLearnedQuiz) {
          startAllLearnedQuiz();
        } else {
          startDeckSession(state.mode, 0);
        }
      });

      document.getElementById("toCategoriesBtn").addEventListener("click", () => {
        state.screen = "categories";
        render();
      });
    }

    // Проверка по всем изученным словам: в случайном порядке, письменно
    function startAllLearnedQuiz() {
      clearAutoAdvanceTimer();
      const pool = collectAllLearnedWords();
      if (!pool.length) return;
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      state.mode = "learned_quiz";
      state.quizPool = pool;
      state.cardIndex = 0;
      state.sessionCorrect = 0;
      state.sessionAnswered = 0;
      state.mistakes = [];
      state.feedback = null;
      state.testInput = "";
      state.screen = "session";
      render();
    }

    // Ссылка с дорожки: #deck=w1d1&step=w01-mon-05[&mode=study|test|word_study|word_test] сразу открывает колоду
    function openFromHash() {
      const params = new URLSearchParams(location.hash.slice(1));
      const deckId = params.get("deck");
      if (!deckId || !DECK_BY_ID.has(deckId)) return false;
      state.selectedDeckId = deckId;
      state.stepId = params.get("step");
      const mode = params.get("mode");
      state.screen = "mode_select";
      if (mode === "study" || mode === "article_quiz" || mode === "test" || WORD_MODES.has(mode)) {
        const deck = DECK_BY_ID.get(deckId);
        startDeckSession(modePool(deck, mode).length ? mode : "test", 0);
        return true;
      }
      render();
      return true;
    }

    window.addEventListener("hashchange", () => {
      if (state.screen !== "loading" && state.screen !== "nologin" && state.screen !== "error") openFromHash();
    });

    // Запуск приложения: сессия сайта → прогресс из store.js → слова
    async function boot() {
      render();
      if (!sess) {
        state.screen = "nologin";
        render();
        return;
      }
      try {
        await Promise.all([loadProgress(), loadDecks(), loadPlanSteps()]);
      } catch (err) {
        console.warn("trainer load failed", err);
        state.screen = "error";
        state.errorMsg = "Не удалось загрузить слова. Обновите страницу.";
        render();
        return;
      }
      if (!progress.words) progress.words = {};
      onSaveState((s) => {
        state.saveState = s;
        const badge = document.getElementById("saveBadge");
        if (badge) badge.outerHTML = saveBadgeHtml();
      });
      if (!openFromHash()) {
        state.screen = "categories";
        render();
      }
    }

    boot();
  </script>
</body>
</html>
